{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Editar Produto ✏️</h2>
    <a href="{{ url_for('admin.admin_produtos') }}" class="btn btn-outline-light">Voltar</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card bg-dark border-secondary p-4">
            
            <!-- 🚨 MOSTRA A FOTO ATUAL DO PRODUTO -->
            <div class="text-center mb-4">
                {% if produto.foto %}
                    <img src="{{ url_for('static', filename='uploads/' + produto.foto) }}" 
                         alt="{{ produto.nome }}" 
                         class="rounded border border-secondary"
                         style="width: 150px; height: 150px; object-fit: contain; background-color: #fff;">
                    <p class="text-muted small mt-2">Foto atual do produto</p>
                {% else %}
                    <div class="bg-secondary rounded d-flex align-items-center justify-content-center mx-auto" style="width: 150px; height: 150px;">
                        <span class="text-white">Sem Foto</span>
                    </div>
                {% endif %}
            </div>

            <form method="POST" action="{{ url_for('admin.salvar_edicao_produto', produto_id=produto.id) }}">
                
                <div class="mb-3">
                    <label class="form-label text-white">Nome do Lanche/Bebida</label>
                    <input type="text" name="nome" class="form-control bg-dark text-white border-secondary" value="{{ produto.nome }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-white">Descrição (Ingredientes)</label>
                    <textarea name="descricao" class="form-control bg-dark text-white border-secondary" rows="3">{{ produto.descricao }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Preço (R$)</label>
                    <input type="number" step="0.01" name="preco" class="form-control bg-dark text-white border-secondary" value="{{ produto.preco }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Categoria</label>
                    <select name="categoria" class="form-select bg-dark text-white border-secondary">
                        <option value="lanche" {% if produto.categoria == 'lanche' %}selected{% endif %}>Lanche</option>
                        <option value="bebida" {% if produto.categoria == 'bebida' %}selected{% endif %}>Bebida</option>
                        <option value="porcao" {% if produto.categoria == 'porcao' %}selected{% endif %}>Porção</option>
                        <option value="extra" {% if produto.categoria == 'extra' %}selected{% endif %}>Adicional (Extra)</option>
                    </select>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="permite_extra" id="permite_extra" {% if produto.permite_extra %}checked{% endif %}>
                    <label class="form-check-label text-white" for="permite_extra">
                        Este produto permite adicionar extras?
                    </label>
                </div>

                <button type="submit" class="btn btn-orange w-100 btn-lg">Salvar Alterações</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
